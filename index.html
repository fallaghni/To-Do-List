<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>List Tugas</h1>
        <p> Daftar  Catatan Tugas </p>
      </header>

      <main>
        <section class="todo-box">
          <div class="input-wrapper">
            <input
              type="text"
              id="tugas-input"
              placeholder="Masukkan tugas atau catatan..."
              autocomplete="off"
            />

            <button id="btn-tambah">Tambah</button>
          </div>

          <div class="list-container">
            <h2>Daftar Tugas <span id="jumlah-tugas">0</span>:</h2>
            

            <ul id="daftar-tugas"></ul>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
